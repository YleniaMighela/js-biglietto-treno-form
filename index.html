<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Biglietto treno form</title>
</head>


<body>
    <!-- MILESTONE 1: -->
    <!-- Iniziamo implementando il programma senza alcuna estetica: usando esclusivamente due input e un bottone (non stilizzati), realizziamo le specifiche scritte sopra. La risposta finale (o output) sarà anch’essa da scrivere in console. -->
    
    <h1>Biglietto treno</h1>
    
    
    <form action="">
        <div>
            <!-- input dove l'utente inserirà il numero di km da percorrere  -->
            <input id="chilometri" placeholder="Inserisci km da percorrere" type="text">
        </div>
        
        
        <div>
            <!-- input dove l'utente inseirà l'età del passeggero -->
            <input id="età" placeholder="Inserisci l'età" type="text">
        </div>
        
        
        <div>
            <!-- bottone che calcolerà i dati inseriti -->
            <button> Calcola Prezzo </button>
            
        </div>
        
        
        
    </form>
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    <script src="js/script.js"></script>
</body>
</html>
